<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 780 440" role="img" version="1.1">
  <title>Inductor voltage polarity during conduction and during turn-off</title>
  <desc>Two side-by-side schematics of a DC supply driving an inductor in series with an IGBT switch. On the left the switch conducts and the inductor acts as a load. On the right the switch has just opened, the current is still flowing in the same direction but decaying, and the inductor has reversed its terminal polarity so that the collector node is driven far above the supply rail.</desc>

  <defs>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a6b3c"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="440" fill="#ffffff"/>

  <g fill="none" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round">
    <!-- ============ PANEL A : switch ON ============ -->
    <line x1="90" y1="95" x2="290" y2="95"/>
    <line x1="90" y1="95" x2="90" y2="200"/>
    <line x1="68" y1="200" x2="112" y2="200"/>
    <line x1="78" y1="222" x2="102" y2="222" stroke-width="6"/>
    <line x1="90" y1="222" x2="90" y2="350"/>
    <line x1="90" y1="350" x2="290" y2="350"/>
    <line x1="290" y1="95" x2="290" y2="125"/>
    <path d="M290 125 C310 125 310 145 290 145 C310 145 310 165 290 165 C310 165 310 185 290 185 C310 185 310 205 290 205"/>
    <line x1="290" y1="205" x2="290" y2="245"/>
    <rect x="266" y="245" width="48" height="55"/>
    <line x1="290" y1="300" x2="290" y2="350"/>
    <line x1="266" y1="272" x2="214" y2="272"/>

    <!-- ============ PANEL B : switch just OPENED ============ -->
    <line x1="470" y1="95" x2="670" y2="95"/>
    <line x1="470" y1="95" x2="470" y2="200"/>
    <line x1="448" y1="200" x2="492" y2="200"/>
    <line x1="458" y1="222" x2="482" y2="222" stroke-width="6"/>
    <line x1="470" y1="222" x2="470" y2="350"/>
    <line x1="470" y1="350" x2="670" y2="350"/>
    <line x1="670" y1="95" x2="670" y2="125"/>
    <path d="M670 125 C690 125 690 145 670 145 C690 145 690 165 670 165 C690 165 690 185 670 185 C690 185 690 205 670 205"/>
    <line x1="670" y1="205" x2="670" y2="245"/>
    <line x1="670" y1="300" x2="670" y2="350"/>
    <line x1="646" y1="272" x2="594" y2="272"/>
  </g>

  <rect x="646" y="245" width="48" height="55" fill="none" stroke="#b3261e" stroke-width="2" stroke-dasharray="5 4"/>

  <circle cx="290" cy="225" r="3.5" fill="#0b0b0b"/>
  <circle cx="670" cy="225" r="3.5" fill="#0b0b0b"/>

  <line x1="380" y1="35" x2="380" y2="425" stroke="#c9c7c2" stroke-width="1" stroke-dasharray="4 5"/>

  <g font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#0b0b0b">

    <!-- panel titles -->
    <text x="190" y="55" text-anchor="middle" font-size="14" font-weight="600">Switch ON &#8212; steady state</text>
    <text x="570" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#b3261e">Switch OPENING &#8212; flyback transient</text>

    <!-- supply, panel A -->
    <text x="124" y="207" font-size="19" fill="#52514e">+</text>
    <text x="124" y="239" font-size="19" fill="#52514e">&#8722;</text>
    <text x="124" y="266" font-size="13">V<tspan font-size="10" dy="3">s</tspan></text>
    <!-- supply, panel B -->
    <text x="504" y="207" font-size="19" fill="#52514e">+</text>
    <text x="504" y="239" font-size="19" fill="#52514e">&#8722;</text>
    <text x="504" y="266" font-size="13">V<tspan font-size="10" dy="3">s</tspan></text>

    <!-- inductor labels -->
    <text x="324" y="158" font-size="14" font-weight="500">L</text>
    <text x="324" y="174" font-size="11" fill="#52514e">coil</text>
    <text x="704" y="158" font-size="14" font-weight="500">L</text>
    <text x="704" y="174" font-size="11" fill="#52514e">coil</text>

    <!-- switch labels -->
    <text x="324" y="268" font-size="13" font-weight="500">Q1</text>
    <text x="324" y="284" font-size="11" fill="#52514e">on</text>
    <text x="704" y="268" font-size="13" font-weight="500" fill="#b3261e">Q1</text>
    <text x="704" y="284" font-size="11" fill="#b3261e">off</text>
    <text x="206" y="276" text-anchor="end" font-size="13">G</text>
    <text x="586" y="276" text-anchor="end" font-size="13">G</text>
    <text x="324" y="229" font-size="12">C</text>
    <text x="704" y="229" font-size="12">C</text>
    <text x="324" y="320" font-size="12">E</text>
    <text x="704" y="320" font-size="12">E</text>

    <!-- inductor terminal polarity -->
    <text x="274" y="136" text-anchor="end" font-size="20" fill="#52514e">+</text>
    <text x="274" y="210" text-anchor="end" font-size="20" fill="#52514e">&#8722;</text>
    <text x="654" y="136" text-anchor="end" font-size="20" font-weight="700" fill="#b3261e">&#8722;</text>
    <text x="654" y="212" text-anchor="end" font-size="20" font-weight="700" fill="#b3261e">+</text>

    <!-- current labels -->
    <text x="182" y="74" text-anchor="middle" font-size="12" fill="#1a6b3c">I<tspan font-size="10" dy="3">0</tspan></text>
    <text x="562" y="74" text-anchor="middle" font-size="12" fill="#b3261e">I(t), still forward</text>
    <text x="612" y="234" text-anchor="end" font-size="12" fill="#b3261e">v<tspan font-size="10" dy="3">C</tspan><tspan dy="-3"> shoots up</tspan></text>
  </g>

  <!-- current arrows -->
  <g stroke-width="2" fill="none">
    <line x1="160" y1="84" x2="207" y2="84" stroke="#1a6b3c" marker-end="url(#arrK)"/>
    <line x1="222" y1="366" x2="175" y2="366" stroke="#1a6b3c" marker-end="url(#arrK)"/>
    <line x1="540" y1="84" x2="587" y2="84" stroke="#b3261e" marker-end="url(#arrR)"/>
    <line x1="602" y1="366" x2="555" y2="366" stroke="#b3261e" marker-end="url(#arrR)"/>
    <line x1="620" y1="258" x2="620" y2="203" stroke="#b3261e" marker-end="url(#arrR)"/>
  </g>

  <!-- captions -->
  <g font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">
    <text x="190" y="400" fill="#0b0b0b">I = I<tspan font-size="10" dy="3">0</tspan><tspan dy="-3"> constant, so dI/dt = 0</tspan></text>
    <text x="190" y="418" fill="#52514e">coil acts as a LOAD: top +, bottom &#8722; (tiny I<tspan font-size="10" dy="3">0</tspan><tspan dy="-3">R drop)</tspan></text>
    <text x="570" y="400" fill="#0b0b0b">same current direction, but now dI/dt &#8810; 0</text>
    <text x="570" y="418" fill="#b3261e">coil acts as a SOURCE: polarity flips, collector driven above V<tspan font-size="10" dy="3">s</tspan></text>
  </g>
</svg>
