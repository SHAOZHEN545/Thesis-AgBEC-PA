  <title
     id="title1">Inductive switching circuit with IGBT</title>
  <desc
     id="desc1">A closed-loop schematic showing a DC power supply feeding current through an inductor coil into an IGBT transistor that acts as an on-off switch, with the emitter arrow shown on the transistor symbol and a gate lead for the drive signal.</desc>
