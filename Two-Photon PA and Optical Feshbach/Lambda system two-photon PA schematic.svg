<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="ah-black" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#1a1a1a"/>
    </marker>
    <marker id="ah-red" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#e02424"/>
    </marker>
    <marker id="ah-blue" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#1a4fd6"/>
    </marker>
    <marker id="ah-green" markerWidth="9" markerHeight="9" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#2eb62e"/>
    </marker>
  </defs>

  <!-- theme-independent background card -->
  <rect x="0" y="0" width="640" height="470" rx="8" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>

  <!-- ================= AXES ================= -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <line x1="72" y1="442" x2="72" y2="46" marker-end="url(#ah-black)"/>
    <line x1="72" y1="442" x2="610" y2="442" marker-end="url(#ah-black)"/>
    <!-- break marks on energy axis -->
    <line x1="65" y1="266" x2="79" y2="252" stroke-width="1.6"/>
    <line x1="65" y1="258" x2="79" y2="244" stroke-width="1.6"/>
  </g>
  <text x="30" y="150" font-size="15" fill="#1a1a1a" transform="rotate(-90 30 150)" text-anchor="middle">energy</text>
  <text x="340" y="463" font-size="15" fill="#1a1a1a" text-anchor="middle">internuclear distance</text>

  <!-- ================= GROUND POTENTIAL CURVE ================= -->
  <path d="M 138,165 C 176,360 196,376 224,373 C 300,368 356,332 424,317 C 492,308 544,307 580,306"
        fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- hyperfine asymptote levels -->
  <g stroke="#1a1a1a" stroke-width="1.4">
    <line x1="522" y1="288" x2="580" y2="288"/>
    <line x1="522" y1="298" x2="580" y2="298"/>
    <line x1="522" y1="307" x2="580" y2="307"/>
  </g>
  <text x="585" y="291" font-size="11" fill="#1a1a1a">4 + 4</text>
  <text x="585" y="301" font-size="11" fill="#1a1a1a">3 + 4</text>
  <text x="585" y="311" font-size="11" fill="#1a1a1a">3 + 3</text>
  <text x="497" y="330" font-size="19" fill="#1a1a1a">|0⟩</text>

  <!-- ================= FINAL BOUND STATE |2> ================= -->
  <g stroke="#1a1a1a" stroke-width="1.7">
    <line x1="150" y1="330" x2="212" y2="330"/>
    <line x1="150" y1="339" x2="212" y2="339"/>
    <line x1="150" y1="348" x2="212" y2="348"/>
  </g>
  <text x="216" y="346" font-size="19" fill="#1a1a1a">|2⟩</text>
  <text x="150" y="366" font-size="11" fill="#1a1a1a">rotational levels</text>
  <text x="150" y="379" font-size="11" fill="#1a1a1a">ℓ = 0, 2, 4</text>

  <!-- ================= EXCITED STATE |1> ================= -->
  <!-- virtual (laser) level, dashed -->
  <line x1="270" y1="100" x2="400" y2="100" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="6 4"/>
  <!-- bare excited level, solid -->
  <line x1="280" y1="120" x2="390" y2="120" stroke="#1a1a1a" stroke-width="3"/>
  <text x="250" y="126" font-size="19" fill="#1a1a1a">|1⟩</text>
  <!-- detuning Delta indicator -->
  <line x1="410" y1="100" x2="410" y2="120" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="405" y1="100" x2="415" y2="100" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="405" y1="120" x2="415" y2="120" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="420" y="116" font-size="16" fill="#1a1a1a" font-style="italic">Δ</text>

  <!-- ================= LASER ARMS ================= -->
  <!-- L1 : |0> -> |1> (red) -->
  <line x1="455" y1="310" x2="378" y2="106" stroke="#e02424" stroke-width="2.6" marker-end="url(#ah-red)"/>
  <text x="432" y="222" font-size="17" fill="#e02424" font-style="italic">L₁</text>
  <!-- L2 : |2> -> |1> (blue) -->
  <line x1="214" y1="338" x2="300" y2="106" stroke="#1a4fd6" stroke-width="2.6" marker-end="url(#ah-blue)"/>
  <text x="228" y="234" font-size="17" fill="#1a4fd6" font-style="italic">L₂</text>

  <!-- ================= DECAYS (green wavy) ================= -->
  <!-- gamma_1 from |1> -->
  <path d="M 288,128 q -9,9 -3,18 q 6,9 -3,18 q -9,9 -3,18" fill="none" stroke="#2eb62e" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="236" y="182" font-size="16" fill="#2eb62e" font-style="italic">γ₁</text>
  <!-- gamma_2 from |2> -->
  <path d="M 150,352 q -9,9 -3,18 q 6,9 -3,18 q -9,9 -3,18" fill="none" stroke="#2eb62e" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="98" y="398" font-size="16" fill="#2eb62e" font-style="italic">γ₂</text>
</svg>
